---
name: Auto Update README Tables
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  update-readme-tables:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          
      - name: Generate Formatted Tables & Update README
        run: |
          python3 -c '
          import os, re
          
          FOLDER_DESCS = {
              "automation-and-git": "Ansible & Git Guides",
              "commands-and-shell": "Core Commands, Bash & Shell",
              "system-administration": "systemd, Boot & System Tools",
              "networking": "Network Configuration, DNS & VPN",
              "security": "Firewalls, SELinux & Security Tools",
              "containers": "Docker, Podman, and LXC Guides",
              "fedora": "Fedora Linux Specific Documentation (tested on Fedora 44 KDE Plasma)",
              "linux-general": "General Linux Reference",
              "package-management": "Package Managers & App Formats",
              "storage-and-filesystems": "BTRFS, ZFS, RAID & Storage Utilities",
              "desktop-environments": "KDE Plasma, Terminals & Desktop Tools",
              "hardware-and-firmware": "Firmware Updates & Hardware Quirks",
              "networking-and-security": "Networking & Security Configurations",
              "virtualization": "Hypervisor & VM Runbooks",
              "windows-and-macos": "Windows & macOS References"
          }
          
          IGNORE_FILES = {"README.md", "readme.md", "tree_output.txt"}
          
          def get_file_description(filepath):
              if not os.path.isfile(filepath):
                  return ""
              try:
                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                      
                  # Strip out the YAML frontmatter block
                  content = re.sub(r"^---\n.*?\n---\n", "", content, flags=re.DOTALL)
                  
                  # Scan the remaining text for the actual description
                  for line in content.splitlines()[:15]:
                      line = line.strip()
                      if line.startswith("# Description:"):
                          return line.replace("# Description:", "").strip()
                      elif line.startswith("#") and not line.startswith("#!"):
                          return line.lstrip("#").strip()
              except Exception:
                  pass
              return ""
              
          table_output = []
          directories = []
          
          # Recursively walk through all directories
          for root, dirs, files in os.walk("."):
              # Skip hidden directories like .git and .github
              dirs[:] = [d for d in dirs if not d.startswith(".")]
              
              # Check if the folder has any markdown files
              md_files = [f for f in files if f.endswith(".md") and f not in IGNORE_FILES]
              if md_files:
                  directories.append(root)
                  
          directories = sorted(directories)
          
          for d_path in directories:
              if d_path == ".":
                  continue
                  
              folder_name = os.path.basename(d_path)
              folder_desc = FOLDER_DESCS.get(folder_name, "")
              header_desc = f" ({folder_desc})" if folder_desc else ""
              
              clean_path = d_path.lstrip("./")
              table_output.append(f"### 📁 {clean_path}{header_desc}\n")
              table_output.append("| File | Description |")
              table_output.append("|---|---|")
              
              files = sorted([f for f in os.listdir(d_path) if f.endswith(".md") and f not in IGNORE_FILES])
              
              for f in files:
                  file_path = os.path.join(d_path, f)
                  desc = get_file_description(file_path)
                  table_output.append(f"| <a href=\"{clean_path}/{f}\"><code>{f}</code></a> | {desc} |")
              
              table_output.append("\n")
              
          final_str = "\n".join(table_output).strip()
          
          with open("README.md", "r") as f:
              readme = f.read()
              
          pattern = r"(<!-- START_SECTION:tree -->)(.*?)(<!-- END_SECTION:tree -->)"
          updated = re.sub(pattern, lambda m: m.group(1) + "\n" + final_str + "\n" + m.group(3), readme, flags=re.DOTALL)
          
          with open("README.md", "w") as f:
              f.write(updated)
          '
          
      - name: Commit and Push changes
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "ci: update python script to recursively scan subdirectories"
          skip_fetch: true
          skip_push: true

      - name: Push changes (rebase and retry if the branch moved)
        if: steps.auto-commit.outputs.changes_detected == 'true'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another workflow may have pushed to the same branch while this job ran.
          # Rebase onto it (their side wins on overlapping lines) and retry.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X ours origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed; retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          exit 1
