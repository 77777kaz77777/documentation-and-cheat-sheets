name: Auto Update README Tables
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  update-readme-tables:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          
      - name: Generate Formatted Tables & Update README
        run: |
          python3 -c '
          import os, re
          
          FOLDER_DESCS = {
              "ansible": "Ansible Automation Guides",
              "containers": "Docker, Podman, and LXC Guides",
              "fedora": "Fedora Linux Specific Documentation",
              "linux-general": "General Linux Reference",
              "package-management": "Package Managers & App Formats",
              "storage-and-filesystems": "BTRFS, ZFS, RAID & Storage Utilities",
              "desktop-environments": "KDE Plasma, Terminals & Desktop Tools",
              "hardware-and-firmware": "Firmware Updates & Hardware Quirks",
              "networking-and-security": "Networking & Security Configurations",
              "virtualization": "Hypervisor & VM Runbooks",
              "windows-and-macos": "Windows & macOS References"
          }
          
          IGNORE_FILES = {"README.md", "readme.md", "tree_output.txt"}
          
          def get_file_description(filepath):
              if not os.path.isfile(filepath):
                  return ""
              try:
                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                      
                  # Strip out the YAML frontmatter block
                  content = re.sub(r"^---\n.*?\n---\n", "", content, flags=re.DOTALL)
                  
                  # Scan the remaining text for the actual description
                  for line in content.splitlines()[:15]:
                      line = line.strip()
                      if line.startswith("# Description:"):
                          return line.replace("# Description:", "").strip()
                      elif line.startswith("#") and not line.startswith("#!"):
                          return line.lstrip("#").strip()
              except Exception:
                  pass
              return ""
              
          table_output = []
          directories = []
          
          # Recursively walk through all directories
          for root, dirs, files in os.walk("."):
              # Skip hidden directories like .git and .github
              dirs[:] = [d for d in dirs if not d.startswith(".")]
              
              # Check if the folder has any markdown files
              md_files = [f for f in files if f.endswith(".md") and f not in IGNORE_FILES]
              if md_files:
                  directories.append(root)
                  
          directories = sorted(directories)
          
          for d_path in directories:
              if d_path == ".":
                  continue
                  
              folder_name = os.path.basename(d_path)
This is a highly effective GitHub Actions workflow for fully automating your repository's table of contents. By recursively walking the directories and scraping the frontmatter or header descriptions, it completely removes the need to manually update your README every time you add a new cheat sheet or runbook. 

To implement this into your repository, follow these steps to deploy the automation.

<Sequence>
  <Step title="Create the workflow directory">
    Create the GitHub Actions folder structure in the root of your local repository:
    ```bash
    mkdir -p .github/workflows
    ```
  </Step>
  <Step title="Save the workflow file">
    Save the YAML code you provided as a new file named `update-readme.yml` inside the `.github/workflows/` directory.
  </Step>
  <Step title="Prepare your README.md">
    Ensure your root `README.md` contains the exact HTML comment tags the Python script looks for. Open `README.md` and add these lines where you want the tables to appear:
    ```markdown
    <!-- START_SECTION:tree -->
    <!-- END_SECTION:tree -->
    ```
  </Step>
  <Step title="Push to trigger the action">
    Commit the new workflow and the updated README, then push to the `main` branch. GitHub Actions will automatically catch the push, run the Python script, and commit the newly generated tables directly to the repository:
    ```bash
    git add .
    git commit -m "ci: add automated README generation workflow"
    git push
    ```
  </Step>
</Sequence>

