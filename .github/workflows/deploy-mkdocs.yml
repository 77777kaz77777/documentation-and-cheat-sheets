---
name: Deploy Zensical
on:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install zensical
      
      - name: Auto-generate Code Reference Page
        run: |
          python3 -c '
          import os
          
          extensions = (".sh", ".py", ".json")
          exclude_dirs = {".git", ".github"}
          
          output = ["# Source Code Reference\n\nAutomatically generated list of all scripts in this repository.\n"]
          
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in exclude_dirs]
              for file in sorted(files):
                  if file.endswith(extensions):
                      filepath = os.path.join(root, file).lstrip("./")
                      ext = filepath.split(".")[-1]
                      
                      lang = "bash" if ext == "sh" else "python" if ext == "py" else "json"
                      
                      output.append(f"## {filepath}\n")
                      output.append(f"```{lang} title=\"{filepath}\"")
                      output.append(f"--8<-- \"{filepath}\"")
                      output.append("```\n")
          
          with open("code-reference.md", "w") as f:
              f.write("\n".join(output))
          '
          
      - run: zensical build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - uses: actions/deploy-pages@v4
