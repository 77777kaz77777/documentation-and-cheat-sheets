---
name: Deploy Zensical
on:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install zensical
      - run: zensical build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - uses: actions/deploy-pages@v4
