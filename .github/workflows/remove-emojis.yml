name: Strip Emojis from All Markdown Files

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  strip-emojis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Recursively Remove Emojis from .md Files
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const emojiRegex = /(\p{Extended_Pictographic}|\p{Emoji_Component})/gu;

            function processDirectory(dirPath) {
              const entries = fs.readdirSync(dirPath, { withFileTypes: true });
              for (const entry of entries) {
                const fullPath = path.join(dirPath, entry.name);
                if (entry.isDirectory()) {
                  if (entry.name !== "node_modules" && entry.name !== ".git") {
                    processDirectory(fullPath);
                  }
                } else if (entry.isFile() && entry.name.endsWith(".md")) {
                  const content = fs.readFileSync(fullPath, "utf8");
                  const cleaned = content.replace(emojiRegex, "");
                  if (content !== cleaned) {
                    fs.writeFileSync(fullPath, cleaned, "utf8");
                    console.log(`Cleaned: ${fullPath}`);
                  }
                }
              }
            }

            processDirectory(".");
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A "*.md"
          if git diff --cached --quiet; then
            echo "No emojis found in any markdown files."
          else
            git commit -m "style: remove emojis from all markdown files"
            git push
          fi
