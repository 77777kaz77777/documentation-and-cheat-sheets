name: Auto-Fix Markdown Formatting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  markdownlint-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run markdownlint auto-fix
        run: npx markdownlint-cli2 --fix "**/*.md" || true

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix markdown formatting spacing"
