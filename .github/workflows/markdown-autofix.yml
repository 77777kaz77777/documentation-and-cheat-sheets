---
name: Auto-Format Markdown

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
  workflow_dispatch:

# Prevent race conditions when multiple pushes happen back-to-back
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format-markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Run Markdownlint Auto-Fix
        run: npx markdownlint-cli@latest --fix "**/*.md"
        continue-on-error: true

      - name: Pull latest changes to avoid ref lock conflicts
        run: git pull --rebase --autostash origin ${{ github.ref_name }}

      - name: Commit and push formatting changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto-fix markdown formatting spacing"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
