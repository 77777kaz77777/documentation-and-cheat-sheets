name: Check Markdown Links

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Every Monday at 08:17 UTC: catches external links that break between pushes
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Restore Link Cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: |
            lychee-

      - name: Run Lychee Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --cache --max-cache-age 1d './**/*.md'
          format: markdown
          output: lychee-report.md
          # Scheduled runs report through an issue instead of failing
          fail: ${{ github.event_name != 'schedule' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open an Issue for Broken Links (weekly run only)
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken links found by the weekly link check
          content-filepath: lychee-report.md
          labels: broken-links
