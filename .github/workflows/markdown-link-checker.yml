name: Check Markdown Links

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: gaurav-nelson/github-action-markdown-link-checker@v1.10.2
        with:
          folder_path: '.'
          use-verbose-mode: 'yes'
