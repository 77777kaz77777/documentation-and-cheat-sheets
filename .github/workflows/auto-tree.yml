name: Auto Update README Tables

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-readme-tables:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.x'

      - name: Generate Formatted Tables & Update README
        run: |
          python3 -c '
          import os, re

          FOLDER_DESCS = {
              "updates": "Distro maintenance & update scripts",
              "configs": "Terminal & CLI tool dotfiles",
              "desktop-tweaks": "UI customization & desktop scripts",
              "security": "Antivirus & system defense utilities",
              "utils": "General standalone helper scripts",
              "ansible": "Ansible Automation Guides",
              "containers": "Docker, Podman, and LXC Guides",
              "fedora": "Fedora Linux Specific Documentation",
              "linux-general": "General Linux Reference",
              "networking-and-security": "Networking & Security Configurations",
              "virtualization": "Hypervisor & VM Runbooks",
              "windows-and-macos": "Windows & macOS References",
              "networking": "Networking Automation",
              "provisioning": "User Provisioning & Bootstrapping",
              "proxmox": "Proxmox Virtual Environment Scripts"
          }

          IGNORE_PATHS = {".git", ".github", "README.md", "tree_output.txt"}

          def get_file_description(filepath):
              if not os.path.isfile(filepath):
                  return ""
              try:
                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      for _ in range(5):
                          line = f.readline().strip()
                          if line.startswith("# Description:"):
                              return line.replace("# Description:", "").strip()
                          elif line.startswith("#") and not line.startswith("#!"):
                              return line.lstrip("#").strip()
              except Exception:
                  pass
              return ""

          entries = sorted([e for e in os.listdir(".") if e not in IGNORE_PATHS and os.path.isdir(e)])
          table_output = []

          for d in entries:
              folder_desc = FOLDER_DESCS.get(d, "")
              header_desc = f" ({folder_desc})" if folder_desc else ""
              
              table_output.append(f"### 📁 {d}/{header_desc}\n")
              table_output.append("| File | Description |")
              table_output.append("|---|---|")
              
              sub_path = os.path.join(".", d)
              files = sorted([f for f in os.listdir(sub_path) if f not in IGNORE_PATHS and os.path.isfile(os.path.join(sub_path, f))])
              
              if not files:
                  table_output.append("| *(Empty)* | |")
              
              for f in files:
                  file_path = os.path.join(sub_path, f)
                  desc = get_file_description(file_path)
                  table_output.append(f"| `{f}` | {desc} |")
              
              table_output.append("\n")

          final_str = "\n".join(table_output).strip()

          with open("README.md", "r") as f:
              readme = f.read()

          pattern = r"(<!-- START_SECTION:tree -->)(.*?)(<!-- END_SECTION:tree -->)"
          replacement = r"\1\n" + final_str + r"\n\3"
          updated = re.sub(pattern, replacement, readme, flags=re.DOTALL)

          with open("README.md", "w") as f:
              f.write(updated)
          '

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5.1.0
        with:
          commit_message: "docs: auto-update directory tables in README"
