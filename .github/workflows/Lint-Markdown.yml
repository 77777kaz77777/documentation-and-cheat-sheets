name: Lint Markdown Files

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run markdownlint-cli2
        run: npx markdownlint-cli2 "**/*.md"
