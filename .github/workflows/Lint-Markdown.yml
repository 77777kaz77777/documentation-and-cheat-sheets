name: Markdown Linter

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install -g markdownlint-cli2@0.23.2

      - name: Run markdownlint-cli2 with auto-fix
        # The --package flag is required because the executable name differs from the package name
        run: npx --package=markdownlint-cli2 markdownlint-cli2-fix "**/*.md"
