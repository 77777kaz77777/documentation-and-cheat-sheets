name: Lint Markdown Files

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Run Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v19.0.0
        with:
          globs: '**/*.md'
        env:
          ACTIONS_RUNNER_USE_NODE20: "true"
