---
name: Documentation CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ github.token }}

      # (Your specific markdown formatting and table updating steps go here)
      # e.g., run: npm install -g prettier && prettier --write "**/*.md"

      - name: Pull latest remote changes
        run: git pull origin main --rebase

      - name: Auto-commit formatted changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "ci: update tables and auto-format markdown"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "77777kaz77777 <153332224+77777kaz77777@users.noreply.github.com>"
          branch: main
