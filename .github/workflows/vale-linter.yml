name: Vale Prose Linter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  vale:
    name: Lint Prose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Default Vale Config
        run: |
          cat << 'EOF' > .vale.ini
          StylesPath = styles
          MinAlertLevel = error
          
          [*.md]
          BasedOnStyles = 
          EOF

      - name: Run Vale Linter
        uses: errata-ai/vale-action@v2
        with:
          files: '.'
          level: 'error'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
